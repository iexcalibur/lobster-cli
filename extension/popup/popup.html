<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LobsterCLI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <span class="logo">&#x1F99E;</span>
        <h1>LobsterCLI</h1>
      </div>
      <button id="btn-settings" class="icon-btn" title="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>
          <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.421 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.421-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/>
        </svg>
      </button>
    </div>

    <!-- Page Info Bar -->
    <div id="page-info" class="page-info">
      <div class="page-title" id="page-title">Loading...</div>
      <div class="page-meta" id="page-meta"></div>
    </div>

    <!-- Tab Navigation -->
    <div class="tabs">
      <button class="tab active" data-tab="summary">Summary</button>
      <button class="tab" data-tab="extract">Extract</button>
      <button class="tab" data-tab="forms">Forms</button>
      <button class="tab" data-tab="network">Network</button>
      <button class="tab" data-tab="ai">AI</button>
    </div>

    <!-- Tab Content -->
    <div class="tab-content">
      <!-- Summary Tab -->
      <div class="tab-panel active" id="panel-summary">
        <div id="summary-content" class="content-area">
          <div class="loading">Analyzing page...</div>
        </div>
      </div>

      <!-- Extract Tab -->
      <div class="tab-panel" id="panel-extract">
        <div class="button-row">
          <button class="action-btn" data-extract="markdown">Markdown</button>
          <button class="action-btn" data-extract="snapshot">Snapshot</button>
          <button class="action-btn" data-extract="text">Text</button>
        </div>
        <div id="extract-output" class="content-area code-area">
          <div class="placeholder">Click a button to extract content</div>
        </div>
        <button id="btn-copy-extract" class="copy-btn" style="display:none">Copy to Clipboard</button>
      </div>

      <!-- Forms Tab -->
      <div class="tab-panel" id="panel-forms">
        <div id="forms-content" class="content-area">
          <div class="loading">Scanning forms...</div>
        </div>
      </div>

      <!-- Network Tab -->
      <div class="tab-panel" id="panel-network">
        <div class="button-row">
          <button id="btn-start-intercept" class="action-btn">Start Monitoring</button>
          <button id="btn-refresh-network" class="action-btn" disabled>Refresh</button>
        </div>
        <div id="network-content" class="content-area">
          <div class="placeholder">Click "Start Monitoring" to capture API calls</div>
        </div>
      </div>

      <!-- AI Tab -->
      <div class="tab-panel" id="panel-ai">
        <div id="ai-no-key" class="ai-setup">
          <p>AI features need an API key.</p>
          <p class="small">Supports OpenAI, Anthropic, Google Gemini, and Ollama.</p>
          <button id="btn-setup-ai" class="action-btn primary">Configure AI Provider</button>
        </div>
        <div id="ai-ready" class="ai-ready" style="display:none">
          <div class="ai-provider-badge" id="ai-provider-badge"></div>
          <textarea id="ai-prompt" class="ai-input" placeholder="Ask anything about this page...&#10;&#10;Examples:&#10;- What is this page about?&#10;- Summarize the main content&#10;- What data does this site collect?&#10;- Find the pricing information"></textarea>
          <button id="btn-ai-ask" class="action-btn primary full-width">Ask AI</button>
          <div id="ai-output" class="content-area" style="display:none"></div>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <span id="status-text">Ready</span>
      <span id="status-badge" class="badge"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
